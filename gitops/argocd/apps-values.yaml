# Values for the argo/argocd-apps chart.
# Install this after the argo/argo-cd chart has created the Argo CD CRDs.

applications:
  # Manages the database, namespace, Secrets, and platform resources.
  boutique:
    namespace: argocd
    project: default
    source:
      repoURL: https://github.com/sanketwadekar3/DevOps_Project.git
      targetRevision: main
      path: gitops
    destination:
      server: https://kubernetes.default.svc
      namespace: boutique
    syncPolicy:
      automated:
        prune: true
        selfHeal: true

  auth:
    namespace: argocd
    project: default
    source:
      repoURL: https://github.com/sanketwadekar3/DevOps_Project.git
      targetRevision: main
      path: gitops/charts/boutique-services
      helm:
        releaseName: auth
        valueFiles:
          - ../../k8s/boutique-microservices/auth.yaml
    destination: { server: "https://kubernetes.default.svc", namespace: boutique }
    syncPolicy:
      automated:
        prune: true
        selfHeal: true

