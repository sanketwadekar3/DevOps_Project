# Values for the user profile service.
nameOverride: user-service

image:
  repository: sanketwadekar3/user-service
  tag: 4ae78e3
  pullPolicy: IfNotPresent

containerPort: 3006

env:
  - name: NODE_ENV
    value: development
  - name: PORT
    value: "3006"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: boutique-secrets
        key: USERS_DB_URL
