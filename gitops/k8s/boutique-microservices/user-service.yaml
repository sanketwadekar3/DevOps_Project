# Values for the user profile service.
nameOverride: user-service

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/user-service
  tag: 1ebec3729cd10fe1eeac6f0858fba58e2da07956
  pullPolicy: IfNotPresent

containerPort: 3006

env:
  - name: NODE_ENV
    value: development
  - name: PORT
    value: "3006"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: boutique-secrets
        key: USERS_DB_URL
