# Values for the cart and checkout service.
nameOverride: order-service

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/order-service
  tag: 1ebec3729cd10fe1eeac6f0858fba58e2da07956
  pullPolicy: IfNotPresent

containerPort: 3004

env:
  - name: NODE_ENV
    value: development
  - name: PORT
    value: "3004"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: boutique-secrets
        key: ORDERS_DB_URL
  - name: AUTH_SERVICE_URL
    value: "http://auth:3002"
  - name: PRODUCT_SERVICE_URL
    value: "http://product-service:3003"
