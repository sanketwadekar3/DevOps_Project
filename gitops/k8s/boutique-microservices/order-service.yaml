# Values for the cart and checkout service.
nameOverride: order-service

image:
  repository: sanketwadekar3/order-service
  tag: b7d0a24
  pullPolicy: IfNotPresent

containerPort: 3004

env:
  - name: NODE_ENV
    value: development
  - name: PORT
    value: "3004"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: boutique-secrets
        key: ORDERS_DB_URL
  - name: AUTH_SERVICE_URL
    value: "http://auth:3002"
  - name: PRODUCT_SERVICE_URL
    value: "http://product-service:3003"
