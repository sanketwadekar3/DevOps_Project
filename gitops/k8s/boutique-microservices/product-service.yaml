# Values for the product catalog service.
nameOverride: product-service

image:
  repository: sanketwadekar3/product-service
  tag: b7d0a24
  pullPolicy: IfNotPresent

containerPort: 3003

env:
  - name: NODE_ENV
    value: development
  - name: PORT
    value: "3003"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: boutique-secrets
        key: PRODUCTS_DB_URL
