{{- $hpa := default dict .Values.autoscaling }}
{{- if $hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "boutique-services.name" . }}
  labels:
    {{- include "boutique-services.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "boutique-services.name" . }}
  minReplicas: {{ $hpa.minReplicas | default 1 }}
  maxReplicas: {{ required "autoscaling.maxReplicas is required" $hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $hpa.targetCPUUtilizationPercentage | default 80 }}
{{- end }}
