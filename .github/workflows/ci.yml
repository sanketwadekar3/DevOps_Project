name: Build and Publish Docker Images

on:
  push:
    branches: [main]
    paths:
      - "projects/boutique-microservices/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "projects/boutique-microservices/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-hub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            image: auth-service
            context: projects/boutique-microservices/backend/services/auth
          - name: gateway
            image: gateway-service
            context: projects/boutique-microservices/backend/services/gateway
          - name: orders
            image: orders-service
            context: projects/boutique-microservices/backend/services/orders
          - name: order-service
            image: order-service
            context: projects/boutique-microservices/backend/services/order-service
          - name: product-service
            image: product-service
            context: projects/boutique-microservices/backend/services/product-service
          - name: user-service
            image: user-service
            context: projects/boutique-microservices/backend/services/user-service
          - name: frontend
            image: boutique-frontend
            context: projects/boutique-microservices/frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  update-gitops:
    name: Update GitOps image tags
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Update image tags
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"

          for file in gitops/k8s/boutique-microservices/*.yaml; do
            sed -i -E "s/^  tag: .*/  tag: ${SHORT_SHA}/" "$file"
          done

      - name: Commit and push GitOps changes
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/k8s/boutique-microservices/*.yaml

          if git diff --cached --quiet; then
            echo "Image tags are already up to date."
            exit 0
          fi

          git commit -m "ci: update image tags to ${SHORT_SHA}"
          git push
